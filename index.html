<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI YouTube Manager</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131d;color:white;font-family:Arial,sans-serif;padding:18px}
.container{max-width:650px;margin:auto}
h1{text-align:center;color:#ff4444}
.card{background:#1d2332;padding:18px;border-radius:14px;margin:15px 0}
button{background:#ff3333;color:white;border:0;padding:13px 18px;border-radius:8px;font-size:16px;cursor:pointer}
input,textarea,select{width:100%;padding:12px;margin:10px 0;background:#10131d;color:white;border:1px solid #555;border-radius:8px}
textarea{min-height:100px}
.preview{max-width:100%;margin-top:10px;border-radius:8px}
.small{color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="container">
<h1>▶ AI YouTube Manager</h1>
<p style="text-align:center">Your Personal YouTube Dashboard</p>

<div class="card">
<h3>🔴 Connect YouTube Channel</h3>
<p id="connection">YouTube channel not connected</p>
<button onclick="connect()">Connect YouTube</button>
</div>

<div class="card">
<h3>🤖 AI Video Script</h3>
<input id="topic" placeholder="Enter your video topic">
<button onclick="generateScript()">Generate Script</button>
<textarea id="script" placeholder="Your video script will appear here"></textarea>
</div>

<div class="card">
<h3>🎬 Select Video</h3>
