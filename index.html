<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI YouTube Manager</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #10131d;
  color: white;
  font-family: Arial, sans-serif;
  padding: 18px;
}

.container {
  max-width: 650px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #ff4444;
}

.card {
  background: #1d2332;
  padding: 18px;
  border-radius: 14px;
  margin: 15px 0;
}

button {
  background: #ff3333;
  color: white;
  border: 0;
  padding: 13px 18px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  margin: 5px 0;
}

button:hover {
  background: #cc2222;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  background: #10131d;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
}

textarea {
  min-height: 150px;
}

.preview {
  width: 100%;
  margin-top: 10px;
  border-radius: 8px;
}

.small {
  color: #aaa;
  font-size: 13px;
}

.status {
  color: #55dd88;
}

.error {
  color: #ff7777;
}
</style>
</head>

<body>

<div class="container">

<h1>▶ AI YouTube Manager</h1>

<p style="text-align:center">
Your Personal YouTube Dashboard
</p>

<!-- YouTube Connection -->

<div class="card">

<h3>🔴 YouTube Channel</h3>

<p id="connection">
Checking YouTube connection...
</p>

<button onclick="connect()">
Connect YouTube
</button>

<button onclick="checkYouTubeStatus()">
Refresh Connection
</button>

</div>

<!-- AI Script Generator -->

<div class="card">

<h3>🤖 AI Video Script</h3>

<input
id="topic"
placeholder="Enter your video topic"
>

<button onclick="generateScript()">
Generate Script
</button>

<textarea
id="script"
placeholder="Your video script will appear here"
></textarea>

<p class="small">
AI Video Script Generator
</p>

</div>

<!-- Video Upload -->

<div class="card">

<h3>🎬 Select Video</h3>

<input
type="file"
id="video"
accept="video/*"
>

<video
id="videoPreview"
class="preview"
controls
style="display:none"
></video>

<p id="videoStatus" class="small">
No video selected
</p>

</div>

<!-- Backend Status -->

<div class="card">

<h3>📡 Backend Status</h3>

<p id="backendStatus">
Checking server...
</p>

<button onclick="checkBackend()">
Check Backend
</button>

</div>

<!-- Dashboard -->

<div class="card">

<h3>📊 Dashboard</h3>

<p>Welcome to AI YouTube Manager!</p>

<p class="status">
Dashboard Loaded Successfully
</p>

</div>

</div>

<script>

// BACKEND URL

const API_URL =
"https://ai-youtube-manager-iw6j.onrender.com";


// CONNECT YOUTUBE

function connect() {

  document.getElementById("connection").textContent =
  "Connecting to Google...";

  window.location.href = API_URL + "/auth/google";

}


// CHECK YOUTUBE CONNECTION

async function checkYouTubeStatus() {

  const connection =
  document.getElementById("connection");

  connection.textContent =
  "Checking YouTube connection...";

  try {

    const response = await fetch(
      API_URL + "/api/youtube/status",
      {
        method: "GET"
      }
    );

    if (!response.ok) {
      throw new Error(
        "Status API error: " + response.status
      );
    }

    const data = await response.json();

    if (data.connected) {

      connection.textContent =
      "YouTube Connected Successfully! Channel: " +
      (data.channel || data.channelName || "Connected");

      connection.className = "status";

    } else {

      connection.textContent =
      "YouTube channel not connected";

      connection.className = "error";

    }

  } catch (error) {

    connection.textContent =
    "Connection check failed. Please try again.";

    connection.className = "error";

    console.error("YouTube Status Error:", error);

  }

}


// AI SCRIPT GENERATOR

async function generateScript() {

  const topic =
  document.getElementById("topic").value.trim();

  const result =
  document.getElementById("script");

  if (!topic) {

    alert("Please enter your video topic.");

    return;

  }

  result.value =
  "AI is generating your script...";

  try {

    const response = await fetch(
      API_URL + "/api/generate-script",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          topic: topic,
          language: "Hindi",
          style: "Engaging"
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.message || "AI generation failed."
      );

    }

    result.value = data.script || "No script received.";

  } catch (error) {

    result.value =
    "Error: " + error.message;

    console.error("AI Script Error:", error);

  }

}


// VIDEO PREVIEW

document.getElementById("video").addEventListener(
  "change",
  function() {

    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("video/")) {

      alert("Please select a video file.");

      this.value = "";

      return;

    }

    const url = URL.createObjectURL(file);

    const preview =
    document.getElementById("videoPreview");

    preview.src = url;

    preview.style.display = "block";

    document.getElementById("videoStatus").textContent =
    "Selected: " + file.name;

  }
);


// CHECK BACKEND

async function checkBackend() {

  const status =
  document.getElementById("backendStatus");

  status.textContent = "Checking...";

  try {

    const response = await fetch(
      API_URL + "/api/health"
    );

    if (!response.ok) {

      throw new Error("Server error: " + response.status);

    }

    const data = await response.json();

    status.textContent =
    (data.message || "Server running") +
    " Status: " + (data.status || "OK");

    status.className = "status";

  } catch (error) {

    status.textContent =
    "Backend connection failed.";

    status.className = "error";

    console.error("Backend Error:", error);

  }

}


// INITIAL CHECKS

checkBackend();

checkYouTubeStatus();

</script>

</body>
</html>
